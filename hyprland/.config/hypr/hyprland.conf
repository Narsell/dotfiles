# Pywal colors!
source = ~/.cache/wal/colors-hyprland

################
### MONITORS ###
################

$main_monitor 	= HDMI-A-1
$second_monitor = DP-1

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=$main_monitor,2560x1440@120,0x0,1.00
monitor=$second_monitor, disabled
#monitor=$second_monitor,preferred,2560x0,1.00

$mainMod = SUPER # Sets "Windows" key as main modifier

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

$terminal = kitty 
$fileManager = nautilus -w
$app_launcher = pgrep -x rofi >/dev/null 2>&1 && killall rofi || rofi -config launcher-config.rasi -show drun -i
$emoji_menu = rofi -config emoji-config.rasi -modi emoji -show emoji -emoji-format '{emoji}' -kb-secondary-copy "" -kb-custom-1 Ctrl+c
$music_player = pear-desktop 
$pwd_manager = keepassxc -platform xcb
$discord = vesktop
$calculator = qalculate-gtk 
$ereader = calibre 
$clipboard_copy = rofi -config simple-config.rasi		\
	-theme-str 'entry { placeholder: "Search Clipboard"; }'	\
	-theme-str 'textbox-prompt-colon { str: "󱘞";  }'	\
	-modi clipboard:/home/daniel/scripts/cliphist-rofi-img.sh -show clipboard 
$clipboard_delete = cliphist list | rofi -config simple-config.rasi				\
	-theme-str 'entry { placeholder: "Delete from Clipboard"; width: 300px;}'	\
	-theme-str 'textbox-prompt-colon { str: "󱘠 ";  }'							\
	-dmenu -display-columns 2 | cliphist delete
 
#################
### AUTOSTART ###
#################

exec-once = waybar & swaync & hyprsunset & hypridle 		# Base "DE" apps
exec-once = firefox & obsidian & $ereader 					# Every-day, most-used I want at start-up
exec-once = awww-daemon 									# Start swww daemon to handle wallpaper transitions
exec-once = otd-daemon										# Open Tablet Driver daemon 
exec-once = xrdb -merge ~/.Xresources 						# Merging XRsources
exec-once = wl-paste --type image --watch cliphist store 	# Cliphist listener
exec-once = wl-paste --type text --watch cliphist store 	# Cliphist listener
exec-once = cliphist wipe 									# Wipe clipboard history
exec-once = mega-cmd-server 								# Start mega server
exec-once = $terminal --title=sterminal						# Silent floating terminal in special workspace

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_DRM_NO_ATOMIC,1
env = CLIPHIST_MAX_ITEM,100 # Max items for clipboard history

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 1

    col.active_border = $color2
    col.inactive_border = $color2

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 0.99
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = $color2
    }

    blur {
        enabled = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Workspace specific monitor setup
workspace = 1,  monitor:$main_monitor
workspace = 2,  monitor:$main_monitor
workspace = 3,  monitor:$main_monitor
workspace = 4,  monitor:$main_monitor
workspace = 5,  monitor:$main_monitor
workspace = 6,  monitor:$main_monitor
workspace = 7,  monitor:$main_monitor
workspace = 9,  monitor:$second_monitor
workspace = 8,  monitor:$second_monitor
workspace = 10, monitor:$second_monitor


dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout =us,es
    kb_variant=,deadtilde 

    numlock_by_default = true 
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

# Important apps
bind = $mainMod, Q, killactive,
bind = $mainMod, W, exec, $terminal
bind = $mainMod, E, exec, xdg-open "https://" 						#open default brower
bind = $mainMod, A, exec, code
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, R, exec, ~/scripts/wallpaper_selector.sh 
bind = $mainMod SHIFT, R, exec, ~/scripts/pywal_global_update.sh
bind = $mainMod, P, exec, $music_player  
bind = $mainMod, O, exec, $discord
bind = $mainMod, I, exec, obsidian
bind = $mainMod, U, exec, $ereader
bind = $mainMod, code:20, exec, gradtemp tgl						# KEY: Minus (non-numpad)
bind = $mainMod, code:62, exec, steam 			  	 				# KEY: Right-shift
bind = $mainMod, code:61, exec, heroic 								# KEY: Forward slash 
bind = $mainMod, code:51, exec, $terminal -e btop 					# KEY: Back slash
bind = $mainMod, code:35, exec, $calculator 						# KEY: Closing square bracket
bind = $mainMod, code:34, exec, $pwd_manager			 			# KEY: Opening square bracket
# Base/Utils 
bind = alt, space, exec, $app_launcher 								# rofi app launcher
bind = $mainMod, code:60, exec, $emoji_menu
bind = $mainMod, space, exec, ~/scripts/keyboard_layout_switch.sh
bind = $mainMod, code:49, exec, swaync-client -t -sw 				# KEY: ` 
bind = $mainMod + alt, F, fullscreen 								# set app to fullscreen
bind = $mainMod SHIFT, L, exec, ~/scripts/rofi-powermenu.sh
bind = $mainMod, M, layoutmsg, togglesplit
bind = $mainMod, N, togglefloating
bind = $mainMod SHIFT, D, exec, killall -SIGUSR1 waybar				# Toggles waybar on and off
# Rofi:
bind = $mainMod, V, exec, $clipboard_copy
bind = $mainMod SHIFT, V, exec, $clipboard_delete 
bind = $mainMod, return, exec, ~/scripts/sink_selector.sh
# Screenshots!
bind = , PRINT, exec, flameshot gui -c
bind = Ctrl, PRINT, exec, flameshot gui --accept-on-select -c
bind = Shift + Ctrl, PRINT, exec, flameshot screen -c

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows
bind = $mainMod CTRL, h, movewindow, l
bind = $mainMod CTRL, l, movewindow, r
bind = $mainMod CTRL, k, movewindow, u
bind = $mainMod CTRL, j, movewindow, d

# Resize windows
bind = $mainMod + ALT, h, resizeactive, -30   0
bind = $mainMod + ALT, l, resizeactive,  30   0
bind = $mainMod + ALT, k, resizeactive,   0 -30
bind = $mainMod + ALT, j, resizeactive,   0  30

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = ALT, TAB,	workspace, previous
# Special workspaces (scratchpad)
bind = $mainMod, Z, togglespecialworkspace, s 
bind = $mainMod, X, togglespecialworkspace, u 
bind = $mainMod, C, togglespecialworkspace, ss 

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1,	 movetoworkspace, 1
bind = $mainMod SHIFT, 2,	 movetoworkspace, 2
bind = $mainMod SHIFT, 3,	 movetoworkspace, 3
bind = $mainMod SHIFT, 4,	 movetoworkspace, 4
bind = $mainMod SHIFT, 5,	 movetoworkspace, 5
bind = $mainMod SHIFT, 6,	 movetoworkspace, 6
bind = $mainMod SHIFT, 7,	 movetoworkspace, 7
bind = $mainMod SHIFT, 8,	 movetoworkspace, 8
bind = $mainMod SHIFT, 9,	 movetoworkspace, 9
bind = $mainMod SHIFT, 0,	 movetoworkspace, 10
bind = $mainMod SHIFT, X,	 movetoworkspace, special:u
bind = $mainMod		 , tab,	 movetoworkspace, previous

# Toggle monitors (enable/disable)
bind = $mainMod SHIFT, F1, exec, ~/scripts/toggle_monitor.sh $main_monitor
bind = $mainMod SHIFT, F2, exec, ~/scripts/toggle_monitor.sh $second_monitor

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Toggle float/pin state on selected window
bind = $mainMod, mouse:274, togglefloating
bind = $mainMod + Shift, mouse:274, pin 

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

## Animation for all windows!
windowrule = match:class (.*), animation slide 

## Setup for special workspaces and apps tied to them

$uspecial_apps_regex=qalculate-gtk|KeePassXC

# Apps to move to special workspaces
windowrule = match:class ($uspecial_apps_regex), workspace special:u
windowrule = match:title sterminal, workspace special:s silent
# Make them float in special workspaces
windowrule = match:class ($uspecial_apps_regex), tag +floating						
windowrule = match:title sterminal, tag +floating 									
# Now set the sizes when floating and center them
windowrule = match:title sterminal, tag +size_70_70
windowrule = match:title sterminal, tag +centered									
windowrule = match:class (qalculate-gtk), tag +size_40_60
windowrule = match:class (qalculate-gtk), tag +centered
windowrule = match:class (KeePassXC), match:title (^.*\s-\sKeePassXC$), tag +size_60_60
windowrule = match:class (KeePassXC), match:title (^.*\s-\sKeePassXC$), tag +centered
# Rules when an app is opened directly in the special workspace
windowrule = match:workspace special:u, tag +floating
windowrule = match:workspace special:s, tag +floating
windowrule = match:workspace special:s, match:class (kitty), opacity 0.8 override 
windowrule = match:workspace special:s, match:class (kitty), tag +centered
windowrule = match:workspace special:s, match:class (kitty), tag +size_70_70 

## Custom apps I want to float regardless of the workspace
windowrule = match:class (org.gnome.Nautilus|org.pulseaudio.pavucontrol|zenity|yad|Turtle-wow|net.davidotek.pupgui2|AppImageLauncher|remove), tag +floating


## Custom apps I want to use specific sizes when floating
windowrule = match:class (org.pulseaudio.pavucontrol), tag +size_40_60

## Floating tags and rules
windowrule = match:tag floating, float on
windowrule = match:tag centered, center on

windowrule = match:tag size_40_60, size (monitor_w*0.4) (monitor_h*0.6)
windowrule = match:tag size_60_60, size (monitor_w*0.6) (monitor_h*0.6)
windowrule = match:tag size_70_70, size (monitor_w*0.7) (monitor_h*0.7)

## Full opacity on pinned windows!
windowrule = match:pin on, opacity 1.0 override
windowrule = match:pin on, persistent_size on
windowrule = match:pin on, border_size 2
windowrule = match:pin on, border_color $color7

## Picture-in-picture floating/pin setup
windowrule = match:class firefox, match:title (^Picture-in-Picture$), float on
windowrule = match:class firefox, match:title (^Picture-in-Picture$), pin on

### Flameshot quirks
windowrule = match:class (flameshot), workspace special:ss
windowrule = match:class (flameshot), stay_focused on
windowrule = match:class (flameshot), fullscreen on

## Opacity overrides
windowrule = match:class (Rofi|com.stremio.stremio|stremio-enhanced), opacity 1.0 override
windowrule = match:title (.*)(-\s)(You[tT]ube|Twitch)(.*), opacity 1.0 override
windowrule = match:title (Netflix), opacity 1.0 override
windowrule = match:class firefox, match:title (^Picture-in-Picture$), opacity 1.0 override
windowrule = match:class (UnrealEditor-?.*), opacity 1.0 override
windowrule = match:class (steam_app_.*), opacity 1.0 override
windowrule = match:class (gamescope), opacity 1.0 override

## Unreal quirks
windowrule = match:class (UnrealEditor-?.*), no_initial_focus on
windowrule = match:class (UnrealEditor-?.*), suppress_event activate
windowrule = match:class (UnrealEditor-?.*), render_unfocused on

## Zoom quirks
windowrule = match:class (zoom), no_initial_focus on
windowrule = match:class (zoom), suppress_event activate

## Apps tied to specific workspaces
windowrule = match:class (firefox), workspace 1
windowrule = match:class (code), workspace 2
windowrule = match:class (jetbrains-rider), workspace 2
windowrule = match:class (obsidian), workspace 3
windowrule = match:class (sioyek), workspace 4
windowrule = match:class (calibre-gui), workspace 4
windowrule = match:class (com.stremio.stremio|stremio-enhanced), workspace 5
windowrule = match:class (heroic|com.hypixel.HytaleLauncher|CurseForge), workspace 6
windowrule = match:class (steam), match:title (Steam|Friends List), workspace 6
windowrule = match:class (steam_app_.*|gamescope), match:title (^.+$), workspace 7
windowrule = match:title (Battle.net\s?.*), workspace 6	
windowrule = match:class (hl2_linux), workspace 7
windowrule = match:class (Minecraft\\s\\d\\.\\d+\\.\\d+), workspace 7
windowrule = match:class (HytaleClient), workspace 7
windowrule = match:class (com.github.th-ch.youtube-music), workspace 8
windowrule = match:class (vesktop), workspace 9

## Steam games should be fullscreen by default
#windowrule = match:class (steam_app_.*), match:title (^.+$), fullscreen on
#windowrule = match:title (Battle.net\s?.*), fullscreen off  # Except battle net launcher... (This gets initialized like a steam app somewhow...)
#windowrule = match:title (Battle.net\s?.*), float off
#windowrule = match:title (World of Warcraft) fullscreen on

## Rules for nameless launcher's tray icons
windowrule = match:class (steam_app_.*), match:title (^$), workspace 6 
windowrule = match:class (steam_app_.*), match:title (^$), size 20 20

## Ignore maximize requests from apps.
#windowrule = match:class (.*) suppressevent maximize
## Fix some dragging issues with XWayland (no clue how this works with the new syntax, TODO I guess)
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

## Rofi effects
windowrule = match:class rofi, stay_focused on
windowrule = match:class rofi, dim_around on

## Layer Rules
layerrule = dim_around on, match:namespace rofi 
layerrule = animation popin, match:namespace rofi
layerrule = dim_around on, match:namespace swaync-control-center
layerrule = animation slide, match:namespace swaync-control-center
